name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * *'   # daily, so a new Claude Code release that changes its hooks fails here first
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -exec node --check {} \;
          bash -n bin/claude-s install.sh uninstall.sh widgets/swiftbar/*.sh tests/*.sh packaging/homebrew/*.sh
          for f in $(find . -name '*.json' -not -path './node_modules/*'); do node -e "JSON.parse(require('fs').readFileSync('$f'))"; done

      - name: Validate plugin and marketplace manifests
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict ./plugins/agent-status
          npx -y @anthropic-ai/claude-code plugin validate --strict .

      - name: Navigation tests (which window / tab belongs to a session)
        run: node tests/navigation.test.js

      - name: Keep-awake and approval tests
        run: |
          node tests/keepawake.test.js
          bash tests/keepawake.integration.sh

      - name: Notification, compatibility and self-update tests
        run: |
          node tests/notifications.test.js
          bash tests/notifications.integration.sh

      - name: Launcher and installer tests
        run: |
          bash tests/launcher.test.sh
          bash tests/homebrew.layout.test.sh

      - name: Smoke test (hook -> service -> API)
        env:
          AGENT_STATUS_PORT: "4399"
          AGENT_STATUS_DIR: ${{ runner.temp }}/agent-status
        run: |
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci-1","cwd":"'"$PWD"'","prompt":"hello"}' \
            | node plugins/agent-status/scripts/report.js
          sleep 1
          curl -sf http://127.0.0.1:4399/health
          curl -sf http://127.0.0.1:4399/api/agents | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const a = d.agents.find((x) => x.id === "ci-1");
            if (!a || a.status !== "in_progress") { console.error(JSON.stringify(d)); process.exit(1); }
            console.log("ok:", a.project, a.status);'
          bin/claude-s status
          bin/claude-s stop

  claude-code:
    name: latest Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the latest Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Real Claude Code session with the plugin (local stand-in API, no network)
        run: bash tests/claude-code.e2e.sh
      - name: Real interactive session - permission prompt, Esc, quit
        run: python3 tests/claude-code.interactive.py
